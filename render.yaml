services:
  - type: web
    name: moneytrack-backend
    runtime: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: "*"
      - key: SERVE_FRONTEND
        value: "false"
    disk:
      name: moneytrack-data
      mountPath: /app/backend/data
      sizeGB: 1
