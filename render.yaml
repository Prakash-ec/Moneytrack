services:
  - type: web
    name: moneytrack-backend
    runtime: python
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: "https://moneytrack-frontend.onrender.com,http://localhost:5173,https://localhost,capacitor://localhost"
      - key: SERVE_FRONTEND
        value: "false"

  - type: web
    name: moneytrack-frontend
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "frontend/dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://moneytrack-backend.onrender.com/api"
