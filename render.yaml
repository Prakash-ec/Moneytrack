services:
  - type: web
    name: moneytrack-backend
    runtime: python
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: "production"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ALLOW_REGISTRATION
        value: "false"
      - key: RUN_STARTUP_MIGRATIONS
        value: "false"
      - key: CORS_ORIGINS
        value: "https://moneytrack-frontend.onrender.com,https://moneytrack-frontend-g5is.onrender.com,https://moneytrack-frontend-bujt.onrender.com,http://localhost:5173,https://localhost,capacitor://localhost"
      - key: CORS_ORIGIN_REGEX
        value: "^https://moneytrack-frontend.*\\.onrender\\.com$"
      - key: SERVE_FRONTEND
        value: "false"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY_FALLBACK
        sync: false
      - key: GROQ_MODEL
        value: "qwen/qwen3.8-27b"
      - key: KEEP_ALIVE_ENABLED
        value: "true"
      - key: KEEP_ALIVE_INTERVAL_MINUTES
        value: "12"
      - key: KEEP_ALIVE_URL
        value: "https://moneytrack-backend-g5is.onrender.com"

  - type: web
    name: moneytrack-frontend
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "frontend/dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://moneytrack-backend-g5is.onrender.com/api"
