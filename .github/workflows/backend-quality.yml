name: Backend Quality & Verification Pipeline

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-quality.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-quality.yml"
  workflow_dispatch:

concurrency:
  group: backend-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-check:
    name: Backend Lint, Type, Security & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHONPATH: backend
      ENVIRONMENT: test
      AUTH_REQUIRED: "true"
      SECRET_KEY: "test-secret-key-32-chars-long-for-ci-pipeline"
      GROQ_API_KEY: ""
      DATABASE_URL: "sqlite:///ci_test.db"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements-dev.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: 1. Ruff Lint Check
        run: |
          ruff check backend/app backend/tests --config backend/pyproject.toml
        continue-on-error: true # Captures baseline lint findings without aborting pipeline

      - name: 2. Ruff Formatting Check
        run: |
          ruff format --check backend/app backend/tests --config backend/pyproject.toml
        continue-on-error: true

      - name: 3. Mypy Static Type Checking
        run: |
          mypy --config-file backend/pyproject.toml backend/app
        continue-on-error: true

      - name: 4. Bandit Security Scan
        run: |
          bandit -c backend/.bandit -r backend/app

      - name: 5. pip-audit Dependency Vulnerability Scan
        run: |
          pip-audit -r backend/requirements.txt
        continue-on-error: true # Retains audit trace for legacy dependencies without aborting

      - name: 6. Alembic Migration Verification
        working-directory: backend
        run: |
          alembic heads
          alembic current

      - name: 7. SQLite Integrity & Schema Verification
        run: |
          python -c "import sqlite3; con = sqlite3.connect('ci_test.db'); cur = con.cursor(); cur.execute('PRAGMA integrity_check;'); res = cur.fetchall(); print('PRAGMA integrity_check:', res); assert res == [('ok',)]; cur.execute('PRAGMA foreign_key_check;'); fk = cur.fetchall(); print('PRAGMA foreign_key_check:', fk); assert fk == []; con.close()"

      - name: 8. Backend Automated Tests & Coverage
        working-directory: backend
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term-missing
        continue-on-error: true

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report
          path: backend/coverage.xml
          retention-days: 14
