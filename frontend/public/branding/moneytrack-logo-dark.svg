<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" width="420" height="96" fill="none" aria-label="MoneyTrack Logo Dark">
  <!-- Flat brand mark: M + growth arrow + tracking node -->
  <g transform="translate(10, 10)">
    <rect width="76" height="76" rx="20" fill="#161B26" stroke="#232B3B" stroke-width="1.5" />

    <!-- Tracking orbit -->
    <path
      d="M 22 56 A 25 25 0 1 1 60 52"
      stroke="#36B889"
      stroke-opacity="0.45"
      stroke-width="2.6"
      stroke-linecap="round"
    />
    <circle cx="60" cy="52" r="2.2" fill="#36B889" />

    <!-- Left anchor and arch -->
    <path
      d="M 25 54 V 31 C 25 27 28.5 24 32.5 24 C 34.8 24 37 25.2 38.2 27 L 41 31 L 37.5 35.5 L 33 30 C 32 28.8 30.5 29.5 30.5 31 V 54 Z"
      fill="#36B889"
    />

    <!-- Right growth arrow -->
    <path
      d="M 37.5 35.5 L 41 31 L 44 35.5 L 51 26 C 52.5 24 54.5 23 57 23 L 64 17 V 30 L 53.5 30 L 58.5 27 C 57 26 55.2 26.2 54 27.5 L 44.5 39.5 V 54 H 40 V 41 Z"
      fill="#16845B"
    />

    <!-- Nexus -->
    <circle cx="41" cy="37" r="2.6" fill="#06231A" />
    <circle cx="41" cy="37" r="1.2" fill="#F8FAFC" />
  </g>

  <!-- Wordmark -->
  <g transform="translate(104, 48)">
    <text font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="32" letter-spacing="-0.03em" fill="#F8FAFC">Money</text>
    <text x="100" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="32" letter-spacing="-0.03em" fill="#36B889">Track</text>

    <text y="24" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="10" letter-spacing="0" fill="#A3A9B8">Private ledger</text>

    <circle cx="282" cy="-8" r="3.5" fill="#36B889" />
  </g>
</svg>
