<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" width="420" height="96" fill="none" aria-label="MoneyTrack Logo Light">
  <!-- Flat brand mark: M + growth arrow + tracking node -->
  <g transform="translate(10, 10)">
    <rect width="76" height="76" rx="20" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.5" />

    <!-- Tracking orbit -->
    <path
      d="M 22 56 A 25 25 0 1 1 60 52"
      stroke="#16845B"
      stroke-opacity="0.4"
      stroke-width="2.6"
      stroke-linecap="round"
    />
    <circle cx="60" cy="52" r="2.2" fill="#16845B" />

    <!-- Left anchor and arch -->
    <path
      d="M 25 54 V 31 C 25 27 28.5 24 32.5 24 C 34.8 24 37 25.2 38.2 27 L 41 31 L 37.5 35.5 L 33 30 C 32 28.8 30.5 29.5 30.5 31 V 54 Z"
      fill="#16845B"
    />

    <!-- Right growth arrow -->
    <path
      d="M 37.5 35.5 L 41 31 L 44 35.5 L 51 26 C 52.5 24 54.5 23 57 23 L 64 17 V 30 L 53.5 30 L 58.5 27 C 57 26 55.2 26.2 54 27.5 L 44.5 39.5 V 54 H 40 V 41 Z"
      fill="#0F6B49"
    />

    <!-- Nexus -->
    <circle cx="41" cy="37" r="2.6" fill="#0F6B49" />
    <circle cx="41" cy="37" r="1.2" fill="#FFFFFF" />
  </g>

  <!-- Wordmark -->
  <g transform="translate(104, 48)">
    <text font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="32" letter-spacing="-0.03em" fill="#171717">Money</text>
    <text x="100" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="32" letter-spacing="-0.03em" fill="#16845B">Track</text>

    <text y="24" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="10" letter-spacing="0" fill="#525252">Private ledger</text>

    <circle cx="282" cy="-8" r="3.5" fill="#16845B" />
  </g>
</svg>
