<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0D7C66" />
    <title>Offline · MoneyTrack</title>
    <style>
      :root {
        color-scheme: light dark;
        --canvas: #f4f7f6;
        --surface: #ffffff;
        --ink: #0d1e1a;
        --muted: #546861;
        --subtle: #7c8e87;
        --line: #e0e8e4;
        --primary: #0d7c66;
        --primary-soft: #e4f6f0;
        --primary-contrast: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #08110f;
          --surface: #0e1b17;
          --ink: #e7f2ee;
          --muted: #9caea6;
          --subtle: #7a8f86;
          --line: #21352e;
          --primary: #2fbe9e;
          --primary-soft: #10372d;
          --primary-contrast: #041b16;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background:
          radial-gradient(circle at 50% 0%, color-mix(in srgb, var(--primary) 10%, transparent), transparent 42%),
          var(--canvas);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        line-height: 1.55;
      }
      main {
        width: 100%;
        max-width: 27rem;
        padding: 2rem;
        text-align: center;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 1.25rem;
        box-shadow: 0 20px 50px -24px rgb(9 31 39 / 0.35);
      }
      .mark {
        display: grid;
        place-items: center;
        width: 3.5rem;
        height: 3.5rem;
        margin: 0 auto;
        color: var(--primary);
        background: var(--primary-soft);
        border-radius: 1rem;
      }
      h1 { margin: 1.1rem 0 0; font-size: 1.3rem; letter-spacing: -0.02em; }
      p { margin: 0.6rem 0 0; color: var(--muted); font-size: 0.9rem; }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 2.75rem;
        margin-top: 1.5rem;
        padding: 0 1.15rem;
        color: var(--primary-contrast);
        background: var(--primary);
        border-radius: 0.75rem;
        font-size: 0.875rem;
        font-weight: 650;
        text-decoration: none;
      }
      small { display: block; margin-top: 1.4rem; color: var(--subtle); font-size: 0.7rem; }
      svg { width: 1.6rem; height: 1.6rem; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 8.5A2.5 2.5 0 0 1 5.5 6H19v3" />
          <rect x="3" y="8" width="18" height="11" rx="2.5" />
          <path d="M16.5 13.5h.01" />
        </svg>
      </div>
      <h1>MoneyTrack is offline</h1>
      <p>
        The app shell loaded, but the local API cannot be reached. Start the MoneyTrack backend on
        your computer, reconnect to the same Wi-Fi, and try again.
      </p>
      <a href="/">Try again</a>
      <small>Your saved records remain in the local SQLite database.</small>
    </main>
  </body>
</html>
